[build-system]
requires = ["setuptools>=67.1.0", "wheel", "Cython"]
build-backend = "setuptools.build_meta"

[project]
name = "ondewo-nlu-webhook-server"
dynamic = ["version"]
description = "ONDEWO NLU Webhook Server Python"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "Apache-2.0"}
authors = [
    {name = "Ondewo GmbH", email = "office@ondewo.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
keywords = ["ondewo", "nlu", "webhook", "server"]
dependencies = [
    # ONDEWO Open Source Libraries
    "ondewo-nlu-client>=6.0.0",
    # External Libraries
    "beautifulsoup4>=4.12.3",
    "cython",
    "dataclasses>=0.6",
    "dataclasses-json>=0.5.4",
    "docker>=7.1.0",
    "fastapi>=0.115.6",
    "httpx>=0.27.2",
    "jsonschema>=4.23.0",
    "langcodes>=3.4.1",
    "numpy>=2.1.1",
    "ondewo-logging>=3.3.3",
    "pip-licenses",
    "py~=1.11.0",
    "pydantic>=2.8.2",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.0.1",
    "pytz>=2023.2",
    "regex>=2024.4.16",
    "requests>=2.32.2",
    "semantic-version>=2.10.0",
    "setuptools>=67.1.0",
    "starlette>=0.40.0",
    "typing_extensions>=4.12.2",
    "uvicorn>=0.30.4",
]

[project.optional-dependencies]
dev = [
    # Development tools
    "ipykernel",
    "ipython",
    "jupyter",
    "tqdm",
    # Testing
    "coverage>=7.4.3",
    "mock",
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "pytest-rerunfailures>=14.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.6.1",
    "pytest-dotenv>=0.5.2",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    # Code quality
    "types-beautifulsoup4",
    "types-jsonschema",
    "types-mock",
    "types-python-dateutil",
    "types-pytz",
    "types-requests",
    "types-setuptools",
    # Formatting and linting
    "ruff>=0.6.0",
    "black>=24.10.0",
    "mypy>=1.18.0",
    # Pre-commit
    "pre-commit>=3.0.0",
    # Build tools
    "build>=1.0.0",
    "twine>=5.0.0",
]

[tool.setuptools]
packages = ["ondewo_nlu_webhook_server", "ondewo_nlu_webhook_server_custom_integration"]

[tool.setuptools.dynamic]
version = {attr = "ondewo_nlu_webhook_server.version.__version__"}

[tool.setuptools.package-data]
"*" = ["*.png", "*.ico", "*.html"]

# Ruff configuration (replaces flake8)
# Best practice: Configure ruff to work alongside black
[tool.ruff]
target-version = "py314"
line-length = 120
exclude = [
    ".git",
    ".nox",
    "__pycache__",
    "ondewo_utils",
    "playground",
    "venv",
    ".venv",
    "notebooks",
    "build",
    "dist",
    "*.egg-info",
    ".mypy_cache",
    ".ruff_cache",
    ".eggs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black/ruff format)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # Allow exceptions without specifying exception type in except clauses
]

[tool.ruff.lint.isort]
# Configure isort to be compatible with black
known-first-party = ["ondewo_nlu_webhook_server", "ondewo_nlu_webhook_server_custom_integration"]
combine-as-imports = true
force-single-line = false
force-sort-within-sections = true
lines-after-imports = 2
split-on-trailing-comma = true

[tool.ruff.format]
# Configure ruff format to match black's style
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# Black configuration
# Best practice: Configure black to work alongside ruff
[tool.black]
line-length = 120
target-version = ["py313"]  # Note: py314 not yet supported by black, using py313
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.nox
  | __pycache__
  | ondewo_utils
  | playground
  | venv
  | \.venv
  | notebooks
  | build
  | dist
  | \.eggs
  | \.mypy_cache
  | \.ruff_cache
)/
'''
preview = true  # Enable preview features for better formatting

# Ruff per-file-ignores for modules that had mypy ignore_missing_imports
# These modules are third-party or don't have complete type stubs
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"tests/**/*.py" = ["B011"]  # Allow assert statements in tests
"ondewo_nlu_webhook_server_custom_integration/**/*.py" = ["F401", "F811"]  # unused/duplicate imports
"**/ondewo/csi/**/*.py" = ["F401", "F811"]
"**/ondewo/logging/**/*.py" = ["F401", "F811"]
"**/ondewo/nlu/**/*.py" = ["F401", "F811"]
"**/ondewo/s2t/**/*.py" = ["F401", "F811"]
"**/ondewo/sip/**/*.py" = ["F401", "F811"]
"**/ondewo/t2s/**/*.py" = ["F401", "F811"]
"**/ondewo/utils/**/*.py" = ["F401", "F811"]
# Note: Most third-party libraries don't need explicit ignores as ruff handles missing imports gracefully

# MyPy configuration
[tool.mypy]
python_version = "3.14"
mypy_path = "ondewo_nlu_webhook_server:ondewo_nlu_webhook_server_custom_integration"
namespace_packages = true
ignore_errors = false
ignore_missing_imports = false
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_traceback = true
warn_no_return = true
warn_return_any = true
warn_unused_configs = false
exclude = [
    "^tests/.*",
]

[[tool.mypy.overrides]]
module = [
    "ondewo_nlu_webhook_server_custom_integration.*",
    "ondewo.csi.*",
    "ondewo.logging.*",
    "ondewo.nlu.*",
    "ondewo.s2t.*",
    "ondewo.sip.*",
    "ondewo.t2s.*",
    "ondewo.utils.*",
    "_pytest.*",
    "dataclasses_json.*",
    "docker.*",
    "dotenv.*",
    "Cython.*",
    "faker.*",
    "fastapi.*",
    "google.*",
    "httpx.*",
    "grpc.*",
    "grpc_reflection.*",
    "jsonschema.*",
    "langcodes.*",
    "marshmallow.*",
    "numpy.*",
    "pandas.*",
    "pattern.*",
    "polling.*",
    "psutil.*",
    "py.*",
    "pydantic.*",
    "pydantic_core.*",
    "pydub.*",
    "pydub.playback.*",
    "pytest.*",
    "pytest_mock.*",
    "pytypes.*",
    "regex.*",
    "requests.*",
    "responses.*",
    "semantic_version.*",
    "sqlalchemy.*",
    "sqlalchemy_utils.*",
    "starlette.*",
    "tqdm.*",
    "typing_inspect.*",
    "uvicorn.*",
    "yaml.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=ondewo_nlu_webhook_server",
    "--cov=ondewo_nlu_webhook_server_custom_integration",
    "--cov-report=term-missing",
    "--cov-report=html:coverage/html",
    "--cov-report=xml:coverage/coverage.xml",
    "--cov-branch",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
]
norecursedirs = [
    ".git",
    ".nox",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".venv",
    "venv",
    ".mypy_cache",
    ".ruff_cache",
    ".eggs",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Coverage configuration
[tool.coverage.run]
source = ["ondewo_nlu_webhook_server", "ondewo_nlu_webhook_server_custom_integration"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/venv/*",
    "*/.venv/*",
    "*/build/*",
    "*/dist/*",
    "*/*.egg-info/*",
]
branch = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.xml]
output = "coverage/coverage.xml"
