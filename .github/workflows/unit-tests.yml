# Workflow: Tests and Code Style Checks
#
# This workflow runs code style checks (ruff and black), unit tests, and e2e tests
# on every push to the repository.
#
# For more information, see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Tests and Code Style

on:
  push: # Trigger workflow on pushes to any branch
  pull_request: # Trigger workflow on pull requests to any branch

permissions:
  contents: read # Allow read access to repository contents

jobs:
  # Job: Code style checks
  code-style:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python 3.14
        uses: actions/setup-python@v3
        with:
          python-version: "3.14" # Specify Python version

      # Step 3: Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # Step 4: Install dependencies
      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"

      # Step 5: Run ruff linting check
      - name: Run ruff linting check
        run: |
          ruff check .

      # Step 6: Run ruff format check
      - name: Run ruff format check
        run: |
          ruff format --check .

      # Step 7: Run black format check
      - name: Run black format check
        run: |
          black --check .

  # Job: Run unit and integration tests
  unit-tests:
    needs: code-style
    runs-on: ubuntu-latest
    services:
      docker: # Enable Docker service for running containerized tests
        image: docker:dind
        options: --privileged
        ports:
          - 2375:2375 # Expose Docker daemon port

    steps:
      # Step 1: Check out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python 3.14
        uses: actions/setup-python@v3
        with:
          python-version: "3.14" # Specify Python version

      # Step 3: Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # Step 4: Install dependencies
      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"

      # Step 5: Run unit and integration tests
      - name: Run unit and integration tests
        run: |
          # Export environment variables for tests
          set -a
          source envs/local.env
          set +a
          export PYTHONPATH=$PYTHONPATH:$GITHUB_WORKSPACE:.:..:/opt/ondewo-nlu-webhook-server-python
          # Execute the unit and integration test script
          tests/pytest_utils/scripts/webhook_server_tests_unit_int.sh tests/ondewo_nlu_webhook_server

  # Job: Run end-to-end tests
  e2e-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    services:
      docker: # Enable Docker service for running containerized tests
        image: docker:dind
        options: --privileged
        ports:
          - 2375:2375 # Expose Docker daemon port

    steps:
      # Step 1: Check out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python 3.14
        uses: actions/setup-python@v3
        with:
          python-version: "3.14" # Specify Python version

      # Step 3: Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # Step 4: Install dependencies
      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"

      # Step 5: Install Docker for e2e testing
      - name: Install Docker
        if: ${{ !env.ACT }} # skip during local actions testing
        run: |
          # Check if containerd and containerd.io are installed, and remove them if present
          if dpkg -l | grep -q containerd; then
            echo "Removing containerd package..."
            sudo apt-get remove -y containerd
          fi
          if dpkg -l | grep -q containerd.io; then
            echo "Removing containerd.io package..."
            sudo apt-get remove -y containerd.io
          fi
          # Install Docker
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo usermod -aG docker $USER
          newgrp docker

      # Step 6: Run end-to-end tests
      - name: Run end-to-end tests
        run: |
          # Export environment variables for tests
          set -a
          source envs/local.env
          set +a
          export PYTHONPATH=$PYTHONPATH:$GITHUB_WORKSPACE:.:..:/opt/ondewo-nlu-webhook-server-python
          # Execute the e2e test script
          tests/pytest_utils/scripts/webhook_server_tests_e2e.sh tests/e2e
