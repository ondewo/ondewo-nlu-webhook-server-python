# Workflow: Tests and Code Style Checks
#
# This workflow runs code style checks (ruff and black), unit tests, and e2e tests
# on every push to the repository.
#
# For more information, see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Tests and Code Style

on:
  push: # Trigger workflow on pushes to any branch
  pull_request: # Trigger workflow on pull requests to any branch

permissions:
  contents: read # Allow read access to repository contents
  checks: write # Allow writing check results (JUnit test reports)
  pull-requests: write # Allow posting coverage comments on PRs

jobs:
  # Job: Code style checks
  code-style:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14" # Specify Python version

      # Step 3: Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # Step 4: Cache dependencies
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      # Step 5: Install dependencies
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      # Step 6: Run ruff linting check
      - name: Run ruff linting check
        run: |
          ruff check .

      # Step 7: Run ruff format check
      - name: Run ruff format check
        run: |
          ruff format --check .

      # Step 8: Run black format check
      - name: Run black format check
        run: |
          black --check .

  # Job: Run unit and integration tests
  unit-tests:
    needs: code-style
    runs-on: ubuntu-latest
    services:
      docker: # Enable Docker service for running containerized tests
        image: docker:dind
        options: --privileged

    steps:
      # Step 1: Check out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14" # Specify Python version

      # Step 3: Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # Step 4: Cache dependencies
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      # Step 5: Install dependencies
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      # Step 6: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 7: Create output directories for coverage and JUnit reports
      - name: Create coverage and junit directories
        run: mkdir -p coverage junit

      # Step 8: Run unit and integration tests
      - name: Run unit and integration tests
        env:
          DOCKER_HOST: tcp://docker:2375
        run: |
          # Export environment variables for tests
          set -a
          if [ -f envs/local.env ]; then
            source envs/local.env
          else
            echo "Warning: envs/local.env not found, continuing without it"
          fi
          set +a
          export PYTHONPATH=$PYTHONPATH:$GITHUB_WORKSPACE:.:..:/opt/ondewo-nlu-webhook-server-python
          # Execute the unit and integration test script
          tests/pytest_utils/scripts/webhook_server_tests_unit_int.sh tests/ondewo_nlu_webhook_server

      # Step 9: Print coverage summary to workflow logs
      - name: Coverage report (console)
        if: always()
        run: coverage report --skip-empty || true

      # Step 10: Upload coverage XML as artifact
      - name: Upload coverage XML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-xml
          path: coverage/
          retention-days: 30

      # Step 11: Upload JUnit XML as artifact
      - name: Upload JUnit XML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-junit-xml
          path: junit/
          retention-days: 30

      # Step 12: Publish JUnit test results as GitHub Check
      - name: Publish unit test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: junit/pytest_unit-*.xml
          check_name: Unit Test Results

      # Step 13: Upload coverage to Codecov
      - name: Upload unit coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage/coverage-*.xml
          flags: unit
          name: unit-tests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Job: Run end-to-end tests
  e2e-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    services:
      docker: # Enable Docker service for running containerized tests
        image: docker:dind
        options: --privileged

    steps:
      # Step 1: Check out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14" # Specify Python version

      # Step 3: Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # Step 4: Cache dependencies
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      # Step 5: Install dependencies
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      # Step 6: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 7: Create output directories for coverage and JUnit reports
      - name: Create coverage and junit directories
        run: mkdir -p coverage junit

      # Step 8: Run end-to-end tests
      - name: Run end-to-end tests
        env:
          DOCKER_HOST: tcp://docker:2375
        run: |
          # Export environment variables for tests
          set -a
          if [ -f envs/local.env ]; then
            source envs/local.env
          else
            echo "Warning: envs/local.env not found, continuing without it"
          fi
          set +a
          export PYTHONPATH=$PYTHONPATH:$GITHUB_WORKSPACE:.:..:/opt/ondewo-nlu-webhook-server-python
          # Execute the e2e test script
          tests/pytest_utils/scripts/webhook_server_tests_e2e.sh tests/e2e

      # Step 9: Print coverage summary to workflow logs
      - name: Coverage report (console)
        if: always()
        run: coverage report --skip-empty || true

      # Step 10: Upload coverage XML as artifact
      - name: Upload coverage XML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-xml
          path: coverage/
          retention-days: 30

      # Step 11: Upload JUnit XML as artifact
      - name: Upload JUnit XML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit-xml
          path: junit/
          retention-days: 30

      # Step 12: Publish JUnit test results as GitHub Check
      - name: Publish e2e test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: junit/pytest_e2e-*.xml
          check_name: E2E Test Results

      # Step 13: Upload coverage to Codecov
      - name: Upload e2e coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage/coverage-*.xml
          flags: e2e
          name: e2e-tests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
